<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الزمالك.. حكاية وطن أبيض | ZAMALEK SC – The White Castle Story (1911–2026)</title>
<meta name="description" content="مرجع تاريخي ثنائي اللغة (عربي/إنجليزي) لنادي الزمالك المصري من 1911 إلى 2026 — A bilingual Arabic/English documentary history of Zamalek SC.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ================= ZAMALEK – THE WHITE CASTLE STORY ================= */
:root{
  --red:#C8102E; --red-deep:#8E0B20; --gold:#C9A227; --gold-soft:#E4C877;
  --ink:#1F2430; --ink-soft:#3C424D; --muted:#8A8F98;
  --line:#E4E1DC; --paper:#FFFFFF; --paper-soft:#F7F5F2; --paper-card:#FBF9F6;
}
@page{ size:794px 1123px; margin:44px 0 54px;
  @bottom-right{ content:"الزمالك.. حكاية وطن أبيض — ١٩١١–٢٠٢٦"; font-family:'Tajawal', sans-serif; font-size:9px; color:#8A8F98; margin:0 62px; vertical-align:middle; }
  @bottom-left{ content:counter(page); font-family:'Montserrat', sans-serif; font-weight:600; font-size:10px; color:#C8102E; margin:0 62px; vertical-align:middle; }
}
@page cover{ margin:0; }
html,body{ margin:0; padding:0; width:794px; background:#FFFFFF; color:var(--ink); }
body{ font-family:'Noto Naskh Arabic', serif; font-size:15.5px; line-height:1.95; }
@media screen{
  html{ display:flex; justify-content:center; background:#23252A; padding:28px 0; }
  body{ box-shadow:0 10px 44px rgba(0,0,0,.4); }
  .screen-nav{ display:flex; }
}
/* ---------- Latin inline ---------- */
.ltr{ direction:ltr; unicode-bidi:isolate; }
/* ---------- Cover ---------- */
.cover{ page:cover; width:794px; height:1123px; box-sizing:border-box; position:relative;
  overflow:hidden; break-after:page; background:linear-gradient(160deg,#171A21 0%,#10131A 55%,#0C0F15 100%);
  display:flex; flex-direction:column; justify-content:center; padding:64px 60px; color:#F4F2EE; }
.cover .castle{ position:absolute; inset:auto 0 0 0; height:430px; opacity:.16; }
.cover .castle i{ position:absolute; bottom:0; background:#FFFFFF; display:block; }
.cover .redband{ position:absolute; bottom:0; left:0; right:0; height:10px; background:linear-gradient(90deg,var(--red),var(--red-deep) 70%,var(--gold)); }
.cover .goldrule{ position:absolute; top:34px; left:60px; right:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold-soft) 20%,var(--gold-soft) 80%,transparent); }
.cover .kicker{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:12px; letter-spacing:.14em; color:var(--gold-soft); margin-bottom:6px; }
.cover .kicker-en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:10px; letter-spacing:.34em; color:#B8BCC4; text-transform:uppercase; direction:ltr; text-align:right; }
.cover h1{ font-family:'Amiri', serif; font-weight:700; font-size:96px; line-height:1.12; margin:26px 0 0; color:#FFFFFF; }
.cover .sub-ar{ font-family:'Amiri', serif; font-weight:400; font-size:34px; color:var(--gold-soft); margin-top:4px; }
.cover .en-block{ margin-top:34px; direction:ltr; text-align:left; }
.cover .en-club{ font-family:'Playfair Display', serif; font-weight:700; font-size:30px; letter-spacing:.02em; color:#FFFFFF; }
.cover .en-story{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:14px; letter-spacing:.42em; text-transform:uppercase; color:var(--red); margin-top:8px; }
.cover .years{ margin-top:38px; display:flex; align-items:baseline; gap:18px; direction:ltr; justify-content:flex-start; }
.cover .years .y{ font-family:'Montserrat', sans-serif; font-weight:800; font-size:44px; color:var(--gold-soft); letter-spacing:.04em; }
.cover .years .sep{ font-family:'Montserrat', sans-serif; font-weight:400; font-size:20px; color:#8C919B; }
.cover .years-label{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:13px; color:#A9ADB6; margin-top:2px; }
.cover .foot{ position:absolute; bottom:58px; left:60px; right:60px; display:flex; justify-content:space-between; align-items:flex-end; }
.cover .foot .f-ar{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:13.5px; color:#EDEAE4; }
.cover .foot .f-en{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:#9BA0AA; direction:ltr; }
.cover .foot .f-en b{ color:var(--gold-soft); font-weight:700; }
/* ---------- Top screen nav (screen only) ---------- */
.screen-nav{ display:none; position:sticky; top:0; z-index:50; background:#171A21; color:#E9E7E2;
  font-family:'Tajawal', sans-serif; font-size:13px; font-weight:500; padding:10px 18px; gap:18px; flex-wrap:wrap; }
.screen-nav a{ color:var(--gold-soft); text-decoration:none; }
.screen-nav a:hover{ color:#FFFFFF; text-decoration:underline; }
.screen-nav .nav-en{ font-family:'Montserrat', sans-serif; font-size:11px; color:#9BA0AA; }
/* ---------- Main flow ---------- */
.main-content{ padding:0 62px; }
.part-header{ break-after:avoid; break-inside:avoid; margin:30px 0 14px; padding-top:6px; }
.part-header .kicker{ font-family:'Tajawal', sans-serif; font-weight:800; font-size:11px; letter-spacing:.06em; color:var(--red); background:var(--paper-soft); border:1px solid var(--line); display:inline-block; padding:4px 12px; border-radius:20px; }
.part-header .kicker .en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); direction:ltr; unicode-bidi:isolate; }
.part-header h2{ font-family:'Amiri', serif; font-weight:700; font-size:31px; line-height:1.5; margin:10px 0 2px; color:var(--ink); }
.part-header .h2-en{ font-family:'Playfair Display', serif; font-weight:600; font-size:14px; color:var(--muted); direction:ltr; text-align:right; letter-spacing:.04em; }
.divider{ height:3px; width:64px; background:var(--red); margin:10px 0 4px; position:relative; }
.divider:after{ content:""; position:absolute; right:70px; top:1px; height:1px; width:180px; background:var(--gold); }
.ar-p{ margin:10px 0; text-align:right; }
.ar-p b{ font-weight:700; }
.en-box{ direction:ltr; text-align:left; font-family:'Lora', serif; font-size:12.8px; line-height:1.78; color:var(--ink-soft);
  background:var(--paper-card); border-right:none; border-left:3px solid var(--gold); border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:12px 16px; margin:12px 0 6px; border-radius:6px 0 0 6px; break-inside:avoid; }
.en-box p{ margin:6px 0; }
.en-box .en-label{ font-family:'Montserrat', sans-serif; font-weight:700; font-size:8.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:2px; }
.quote{ background:var(--paper-soft); border:1px solid var(--line); border-radius:10px; padding:16px 20px; margin:14px 0; break-inside:avoid; }
.quote .q-ar{ font-family:'Amiri', serif; font-size:18px; font-weight:700; color:var(--ink); }
.quote .q-en{ font-family:'Playfair Display', serif; font-style:italic; font-size:12.5px; color:var(--muted); direction:ltr; text-align:left; margin-top:6px; }
.quote .q-who{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:11px; color:var(--red); margin-top:8px; }
/* ---------- Stat cards ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
.stat-grid.g3{ grid-template-columns:repeat(3,1fr); }
.stat-grid.g2{ grid-template-columns:repeat(2,1fr); }
.stat{ background:var(--paper-card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; text-align:center; break-inside:avoid; }
.stat .n{ font-family:'Montserrat', sans-serif; font-weight:800; font-size:26px; color:var(--red); direction:ltr; }
.stat .n small{ font-size:13px; color:var(--muted); font-weight:700; }
.stat .l-ar{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:12px; color:var(--ink); margin-top:2px; }
.stat .l-en{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); direction:ltr; }
/* ---------- Name evolution cards ---------- */
.evo{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
.evo .ev-card{ background:#FFFFFF; border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:8px; padding:12px 12px 10px; break-inside:avoid; position:relative; }
.evo .ev-card:nth-child(2){ border-top-color:#C99B4A; } .evo .ev-card:nth-child(3){ border-top-color:var(--red); } .evo .ev-card:nth-child(4){ border-top-color:var(--ink); }
.evo .yr{ font-family:'Montserrat', sans-serif; font-weight:800; font-size:15px; color:var(--red); direction:ltr; text-align:center; }
.evo .nm{ font-family:'Amiri', serif; font-weight:700; font-size:16.5px; text-align:center; margin-top:3px; }
.evo .nm-en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:8.5px; letter-spacing:.12em; color:var(--muted); text-align:center; direction:ltr; text-transform:uppercase; margin-top:2px; }
.evo .per{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:10.5px; color:var(--muted); text-align:center; margin-top:4px; }
/* ---------- Timeline ---------- */
.timeline{ margin:16px 0; }
.t-item{ display:flex; gap:14px; padding:7px 0; break-inside:avoid; border-bottom:1px dotted var(--line); }
.t-item:last-child{ border-bottom:none; }
.t-year{ font-family:'Montserrat', sans-serif; font-weight:800; font-size:15px; color:var(--red); min-width:52px; text-align:left; direction:ltr; padding-top:2px; }
.t-body{ flex:1; }
.t-ar{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); }
.t-en{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:10px; color:var(--muted); direction:ltr; text-align:left; margin-top:1px; }
/* ---------- Year chapters ---------- */
.year-chapter{ margin-top:24px; }
.year-head{ break-after:avoid; break-inside:avoid; display:flex; align-items:baseline; gap:12px; border-bottom:2px solid var(--red); padding-bottom:6px; }
.year-head .ynum{ font-family:'Playfair Display', serif; font-weight:900; font-size:34px; color:var(--ink); direction:ltr; line-height:1; }
.year-head .chip{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:10px; color:#FFFFFF; background:var(--red); border-radius:12px; padding:3px 10px; white-space:nowrap; }
.year-head .chip.gold{ background:var(--gold); color:#2B2B22; }
.year-head .chip.gray{ background:#5A616D; }
.year-head .chip.dark{ background:var(--ink); }
.year-head .yt{ flex:1; text-align:left; }
.year-head .y-title{ font-family:'Amiri', serif; font-weight:700; font-size:21px; color:var(--ink); }
.year-head .y-title-en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); direction:ltr; margin-top:1px; }
.year-chapter .ar-p{ font-size:15px; }
.events{ background:var(--paper-soft); border:1px solid var(--line); border-radius:10px; padding:10px 16px 8px; margin:10px 0; break-inside:avoid; }
.events .ev-title{ font-family:'Tajawal', sans-serif; font-weight:800; font-size:11px; color:var(--gold); letter-spacing:.05em; margin-bottom:4px; }
.events ul{ margin:0; padding:0; list-style:none; }
.events li{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:12.5px; color:var(--ink-soft); padding:3px 0; display:flex; gap:8px; }
.events li .d{ color:var(--red); font-weight:700; white-space:nowrap; min-width:78px; }
.events li:before{ content:"◆"; color:var(--gold); font-size:8px; padding-top:7px; }
.src-note{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:10px; color:var(--muted); margin:4px 0 0; }
.src-note .en{ font-family:'Montserrat', sans-serif; font-size:9px; direction:ltr; unicode-bidi:isolate; }
/* ---------- TOC ---------- */
.toc-wrap{ margin:8px 0 4px; }
.toc-part{ break-inside:avoid; margin:10px 0; background:var(--paper-card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; }
.toc-part a{ color:var(--ink); text-decoration:none; }
.toc-part .tp-ar{ font-family:'Amiri', serif; font-weight:700; font-size:17px; }
.toc-part .tp-ar .num{ color:var(--red); font-family:'Tajawal', sans-serif; font-weight:800; font-size:12px; margin-left:6px; }
.toc-part .tp-en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); direction:ltr; text-align:right; }
.years-toc{ columns:4; column-gap:14px; margin:12px 0; }
.years-toc a{ display:block; font-family:'Tajawal', sans-serif; font-weight:500; font-size:11.5px; color:var(--ink-soft); text-decoration:none; padding:1.5px 0; border-bottom:1px dotted var(--line); }
.years-toc a:hover{ color:var(--red); }
.years-toc .y-num{ font-family:'Montserrat', sans-serif; font-weight:700; direction:ltr; unicode-bidi:isolate; color:var(--red); }
/* ---------- Tables ---------- */
.ttable{ width:100%; border-collapse:collapse; margin:12px 0; font-family:'Cairo', sans-serif; font-size:12px; }
.ttable thead{ display:table-header-group; }
.ttable th{ background:var(--ink); color:#F4F2EE; font-weight:700; font-size:11.5px; padding:7px 10px; text-align:right; border:none; }
.ttable th .th-en{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-soft); display:block; direction:ltr; text-align:right; }
.ttable td{ padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-weight:500; color:var(--ink-soft); }
.ttable tr:nth-child(even) td{ background:var(--paper-soft); }
.ttable td.num{ font-family:'Montserrat', sans-serif; font-weight:700; direction:ltr; text-align:right; color:var(--red); }
.ttable tr{ break-inside:avoid; }
.t-caption{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:12px; color:var(--red); margin:14px 0 0; }
.t-note{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:10.5px; color:var(--muted); margin:4px 0 0; }
/* ---------- Legends ---------- */
.legend-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; }
.legend-card{ background:#FFFFFF; border:1px solid var(--line); border-radius:10px; padding:12px 14px; break-inside:avoid; box-shadow:0 1px 0 rgba(0,0,0,.03); }
.legend-card .lg-name{ font-family:'Amiri', serif; font-weight:700; font-size:17px; color:var(--ink); }
.legend-card .lg-name .en{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); direction:ltr; unicode-bidi:isolate; margin-right:6px; }
.legend-card .lg-role{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:10.5px; color:var(--gold); margin-top:1px; }
.legend-card .lg-role .en{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:8.5px; color:var(--muted); direction:ltr; unicode-bidi:isolate; }
.legend-card .lg-body{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.8; }
/* ---------- Checklist ---------- */
.checklist{ margin:12px 0; }
.checklist .ck{ display:flex; gap:10px; padding:6px 0; border-bottom:1px dotted var(--line); break-inside:avoid; }
.checklist .ck .mark{ color:var(--gold); font-family:'Tajawal', sans-serif; font-weight:800; }
.checklist .ck .ck-ar{ font-family:'Tajawal', sans-serif; font-weight:500; font-size:12.5px; color:var(--ink-soft); }
.checklist .ck .ck-ar b{ color:var(--ink); font-weight:800; }
/* ---------- Ending ---------- */
.ending{ page:cover; width:794px; height:1123px; box-sizing:border-box; break-before:page; overflow:hidden; position:relative;
  background:linear-gradient(200deg,#171A21 0%,#10131A 60%,#0C0F15 100%); color:#F4F2EE; display:flex; flex-direction:column; justify-content:center; padding:70px 64px; }
.ending .redband{ position:absolute; top:0; left:0; right:0; height:10px; background:linear-gradient(90deg,var(--gold),var(--red-deep) 60%,var(--red)); }
.ending .e-kicker{ font-family:'Montserrat', sans-serif; font-weight:600; font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-soft); direction:ltr; text-align:right; }
.ending h2{ font-family:'Amiri', serif; font-weight:700; font-size:44px; color:#FFFFFF; margin:14px 0 0; line-height:1.6; }
.ending .e-en{ font-family:'Playfair Display', serif; font-weight:600; font-size:20px; color:var(--gold-soft); direction:ltr; text-align:right; margin-top:8px; }
.ending .e-body{ font-family:'Noto Naskh Arabic', serif; font-size:16.5px; line-height:2.1; color:#D9D6D0; margin-top:26px; max-width:560px; }
.ending .e-nums{ display:flex; gap:26px; margin-top:34px; }
.ending .e-num .n{ font-family:'Montserrat', sans-serif; font-weight:800; font-size:30px; color:var(--red); direction:ltr; }
.ending .e-num .l{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:11px; color:#A9ADB6; margin-top:2px; }
.ending .e-foot{ position:absolute; bottom:36px; left:64px; right:64px; border-top:1px solid rgba(201,162,39,.35); padding-top:12px; display:flex; justify-content:space-between; }
.ending .e-foot .f1{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:12px; color:#EDEAE4; }
.ending .e-foot .f2{ font-family:'Montserrat', sans-serif; font-weight:500; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#9BA0AA; direction:ltr; }
/* ---------- Print fine-tuning ---------- */
h2,h3,.year-head,.part-header{ break-after:avoid; }
.ttable,.legend-grid,.stat-grid,.evo,.timeline{ break-inside:auto; }
a{ color:var(--red); }
.ref-list{ font-family:'Tajawal', sans-serif; font-size:12px; }
.ref-list li{ margin:5px 0; color:var(--ink-soft); }
.ref-list .r-t{ font-weight:800; color:var(--ink); }
.ref-list .r-u{ direction:ltr; unicode-bidi:isolate; font-family:'Montserrat', sans-serif; font-size:10px; color:var(--muted); display:block; }
.section-tag{ font-family:'Tajawal', sans-serif; font-weight:800; font-size:12px; color:var(--red); margin-top:22px; break-after:avoid; }
</style>
</head>
